<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>登录 — HomeDCIM</title>
    <style>
      html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}
      .wrap{height:100%;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#e6eef8}
      .card{background:rgba(255,255,255,0.04);padding:24px;border-radius:8px;width:320px;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
      label{display:block;margin-bottom:10px}
      input{width:100%;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:inherit}
      .btn{width:100%;padding:10px;border-radius:6px;border:0;background:#1e90ff;color:white;font-weight:600;margin-top:8px}
      .muted{color:rgba(255,255,255,0.6);font-size:0.9rem;margin-top:8px;text-align:center}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h3 style="margin:0 0 12px">HomeDCIM 登录</h3>
        <form id="login-form">
          <label>用户名<input id="username" value="root" required /></label>
          <label>密码<input id="password" type="password" value="admin" required /></label>
          <button class="btn" type="submit">登录</button>
        </form>
        <div id="msg" class="muted">默认: 用户名 root / 密码 admin</div>
      </div>
    </div>
    <script>
      document.getElementById('login-form').addEventListener('submit', function(e){
        e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        fetch('/api/login', { method: 'POST', credentials: 'include', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: user, password: pass }) }).then(r=>{
          if (r.ok) return r.json();
          throw new Error('登录失败');
        }).then(j=>{
          // if server returns token, set cookie client-side to ensure browser sends it
          try{
            if (j && j.token){ document.cookie = `hcm_auth=${j.token}; path=/; SameSite=Lax`; }
          }catch(e){}
          // Ensure cookie is sent to server before navigating: perform a credentialed GET then redirect
          try{
            fetch('/', { method: 'GET', credentials: 'include' }).then(()=>{ window.location = '/'; }).catch(()=>{ setTimeout(()=>window.location='/',150); });
          }catch(e){ setTimeout(()=>window.location='/',150); }
        }).catch(err=>{ const m = document.getElementById('msg'); if (m) m.textContent = '登录失败，请检查用户名或密码'; });
      });
    </script>
  </body>
 </html>
