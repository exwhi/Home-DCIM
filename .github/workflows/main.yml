name: Docker Build & Push

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*.*.*-beta"
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/home-dcim-docker

jobs:
  build-and-push:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. 拉取代码 ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 登录 DockerHub ────────────────────────────────────────
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 3. 提取镜像 Tag 元数据 ───────────────────────────────────
      #   push main             → :latest
      #   push v1.2.3 tag       → :1.2.3  :1.2  :1  :latest
      #   push v1.2.3-beta tag  → :1.2.3-beta  :beta
      #   pull_request          → 仅构建，不推送
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-beta') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-beta') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ contains(github.ref, '-beta') }}

      # ── 4. 设置 Docker Buildx ────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. 构建缓存（加速二次构建）───────────────────────────────
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ── 6. 构建并推送 ────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # PR 只构建不推送；merge/tag 才推送
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # ── 7. 防止缓存无限增长 ──────────────────────────────────────
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── 8. 输出推送结果 ──────────────────────────────────────────
      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Pushed ${{ steps.meta.outputs.tags }}"
